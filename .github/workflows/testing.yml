name: Testing

on:
  push:
    branches: ["main", "dev"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testing-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Validate YAML syntax
        run: |
          find . -regextype posix-extended -regex '.*\.ya?ml' -not -path './.git/*' -print0 \
            | xargs -0 -I{} ruby -ryaml -e 'YAML.safe_load_file(ARGV[0])' {}

      - name: Validate root compose
        run: docker compose -f docker-compose.yml config >/dev/null

      # --no-interpolate: no .env here, and 3 vars are required (no default)
      - name: Validate services compose
        run: docker compose -f services/docker-compose.yml config --no-interpolate >/dev/null

      - name: Check all services are listed in Homepage config
        run: |
          services=$(docker compose -f services/docker-compose.yml config --no-interpolate --services | grep -v '^homepage$')
          python3 - $services <<'PY'
          import re
          import sys

          import yaml

          with open("services/homepage/services.yaml") as f:
              data = yaml.safe_load(f) or []


          def norm(value):
              return re.sub(r"[^a-z0-9]", "", str(value).lower())


          def collect_keys(node, out):
              if isinstance(node, list):
                  for item in node:
                      collect_keys(item, out)
              elif isinstance(node, dict):
                  for key, value in node.items():
                      if isinstance(value, list):
                          # nested group: descend, but the group name itself is not a card
                          collect_keys(value, out)
                      else:
                          # leaf card: record it, don't descend into its fields (icon/href/widget...)
                          out.add(norm(key))


          card_keys = set()
          collect_keys(data, card_keys)

          # Each service needs both a "(LAN)" and a "(VPN)" card (e.g. "Pi-hole (LAN)"/"Pi-hole (VPN)")
          missing = []
          for svc in sys.argv[1:]:
              base = norm(svc)
              absent = [flavor for flavor in ("lan", "vpn") if base + flavor not in card_keys]
              if absent:
                  missing.append(f"{svc} ({', '.join(absent)})")
          if missing:
              print("::error::Missing from services/homepage/services.yaml: " + " ".join(missing))
              sys.exit(1)
          PY

      - name: ShellCheck
        run: find . -name "*.sh" -not -path "./.git/*" -print0 | xargs -0 shellcheck -x
