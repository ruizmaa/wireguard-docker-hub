name: Deploy WireGuard (VPS)

# SECURITY: self-hosted runner on a public repo, safe only because this
# triggers on "push" (main requires a PR), never "pull_request".
# Don't add it.
on:
  push:
    branches: [main]
    paths:
      - docker-compose.yml
      - wireguard.sh
      - scripts/lib/update-images.sh
      - scripts/deploy-wireguard.sh

permissions:
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted, vps]
    steps:
      - name: Deploy
        run: |
          cd ~/wireguard-docker-hub
          git pull --ff-only
          ./scripts/deploy-wireguard.sh
