name: Install Smoke Test

on:
  push:
    branches: ["main", "dev"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: install-smoke-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vps-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Run VPS quick-start install
        run: sudo ./scripts/easy-install.sh

      - name: Verify fail2ban is active
        run: |
          sudo systemctl is-active --quiet fail2ban
          sudo fail2ban-client status sshd > /dev/null

      - name: Verify root SSH login and password auth are disabled
        run: |
          sudo sshd -T 2>/dev/null | grep -q '^permitrootlogin no$'
          sudo sshd -T 2>/dev/null | grep -q '^passwordauthentication no$'

      - name: Verify unattended-upgrades is active
        run: sudo systemctl is-active --quiet unattended-upgrades

      - name: Verify wireguard container is running
        run: |
          for i in $(seq 1 12); do
            state=$(sudo docker compose ps --format json wireguard | jq -r '.State')
            if [ "$state" = "running" ]; then
              echo "wireguard container is running"
              exit 0
            fi
            echo "wireguard container state is '$state' (attempt $i/12), retrying in 5s..."
            sleep 5
          done
          echo "wireguard container state is '$state', expected 'running'"
          sudo docker compose logs
          exit 1

      - name: Run network config check
        run: |
          output=$(sudo ./scripts/check-network-config.sh 2>&1)
          echo "$output"
          if echo "$output" | grep -q ERROR; then
            echo "check-network-config.sh reported at least one ERROR"
            exit 1
          fi

      - name: Verify wireguard peer config was generated
        run: sudo docker exec wireguard test -s /config/peer1/peer1.conf

      - name: Verify wg0 interface has a peer configured
        run: |
          for i in $(seq 1 12); do
            output=$(sudo docker exec wireguard wg show wg0 2>&1) || true
            if echo "$output" | grep -q "peer:"; then
              echo "$output"
              echo "wg0 has a peer configured"
              exit 0
            fi
            echo "wg0 not ready yet (attempt $i/12): $output"
            sleep 5
          done
          echo "$output"
          echo "wg0 has no peer configured after 60s"
          exit 1

      - name: Set up a WireGuard client peer
        run: |
          sudo docker cp wireguard:/config/peer1/peer1.conf ./peer1.conf
          sudo chown "$(id -u):$(id -g)" ./peer1.conf
          chmod 600 ./peer1.conf
          gateway=$(sudo docker network inspect bridge --format '{{(index .IPAM.Config 0).Gateway}}')
          image=$(sudo docker compose config --format json | jq -r '.services.wireguard.image')
          sed "s|^Endpoint = .*|Endpoint = ${gateway}:51820|" ./peer1.conf > ./client-wg0.conf
          sudo chmod 600 ./client-wg0.conf
          grep -v -E '^(PrivateKey|PresharedKey) = ' ./client-wg0.conf
          sudo docker run -d --name wg-client --cap-add=NET_ADMIN \
            --sysctl net.ipv4.conf.all.src_valid_mark=1 \
            -v "$(pwd)/client-wg0.conf:/etc/wireguard/wg0.conf" \
            "$image"

      - name: Trigger a handshake attempt
        run: sudo docker exec wg-client sh -c "ping -c 2 -W 2 10.13.13.1" || true

      - name: Verify WireGuard handshake succeeded
        run: |
          for i in $(seq 1 12); do
            output=$(sudo docker exec wg-client wg show wg0)
            if echo "$output" | grep -q "latest handshake"; then
              echo "$output"
              echo "handshake confirmed"
              exit 0
            fi
            echo "no handshake yet (attempt $i/12), retrying in 5s..."
            sleep 5
          done
          echo "$output"
          sudo docker logs wg-client
          echo "no WireGuard handshake after 60s"
          exit 1

      - name: Verify tunnel forwards traffic to the internet
        # GitHub-hosted runners drop outbound ping entirely
        # This checks real TCP connectivity through the tunnel
        run: |
          if ! sudo docker exec wg-client wget -q --no-check-certificate --timeout=5 https://1.1.1.1; then
            echo "wg-client completed the handshake but could not reach the internet through the tunnel"
            sudo docker exec wireguard wg show wg0
            exit 1
          fi
          echo "external HTTPS request through the tunnel succeeded"

      - name: Clean up client container
        if: always()
        run: sudo docker rm -f wg-client || true

  home-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install Docker (same script the home server uses)
        run: sudo ./scripts/basic-install.sh

      - name: Verify fail2ban is active
        run: |
          sudo systemctl is-active --quiet fail2ban
          sudo fail2ban-client status sshd > /dev/null

      - name: Verify root SSH login and password auth are disabled
        run: |
          sudo sshd -T 2>/dev/null | grep -q '^permitrootlogin no$'
          sudo sshd -T 2>/dev/null | grep -q '^passwordauthentication no$'

      - name: Verify unattended-upgrades is active
        run: sudo systemctl is-active --quiet unattended-upgrades

      # SECURITY: this reconfigures the runner's own DNS resolver
      # Safe only because this is a GitHub runner destroyed after the job
      # Never run this job on a self-hosted/persistent runner.
      - name: Free port 53 for pihole (disable systemd-resolved's stub listener)
        run: |
          sudo mkdir -p /etc/systemd/resolved.conf.d
          printf '[Resolve]\nDNSStubListener=no\n' | sudo tee /etc/systemd/resolved.conf.d/no-stub.conf > /dev/null
          sudo systemctl restart systemd-resolved

          # Pin real nameservers and lock the file so nothing reverts it to the now-unbound 127.0.0.53 stub.
          sudo rm -f /etc/resolv.conf
          printf 'nameserver 1.1.1.1\nnameserver 8.8.8.8\n' | sudo tee /etc/resolv.conf > /dev/null
          sudo chattr +i /etc/resolv.conf

          # dockerd caches resolv.conf at startup, so restart it now that DNS is fixed.
          sudo systemctl restart docker

      - name: Start services stack
        working-directory: services
        run: |
          pulled=false
          for attempt in 1 2 3 4 5; do
            if sudo docker compose pull; then
              pulled=true
              break
            fi
            echo "pull failed (attempt $attempt/5, likely Docker Hub rate-limiting), retrying in 15s..."
            sleep 15
          done
          if [ "$pulled" != "true" ]; then
            echo "gave up after 5 pull attempts, not starting the stack"
            exit 1
          fi
          sudo docker compose up -d

      - name: Verify all services are running
        working-directory: services
        run: |
          for i in $(seq 1 12); do
            not_running=$(sudo docker compose ps --format json | jq -r 'select(.State != "running") | .Service')
            if [ -z "$not_running" ]; then
              echo "All services are running"
              exit 0
            fi
            echo "Services not running yet (attempt $i/12): $not_running, retrying in 5s..."
            sleep 5
          done
          echo "Services not running: $not_running"
          sudo docker compose logs
          exit 1

      - name: Install dig for DNS check
        run: sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq dnsutils

      - name: Verify pihole resolves DNS
        run: |
          for i in $(seq 1 12); do
            ip=$(dig +short @127.0.0.1 google.com | head -n1)
            if [ -n "$ip" ]; then
              echo "pihole resolved google.com -> $ip"
              exit 0
            fi
            echo "pihole not answering yet (attempt $i/12), retrying in 5s..."
            sleep 5
          done
          echo "pihole never resolved a DNS query after 60s"
          exit 1

      - name: Verify jellyfin responds
        run: |
          for i in $(seq 1 12); do
            if curl -sf http://127.0.0.1:8096/health; then
              echo "jellyfin healthy"
              exit 0
            fi
            echo "jellyfin not ready yet (attempt $i/12), retrying in 5s..."
            sleep 5
          done
          echo "jellyfin never became healthy after 60s"
          exit 1

      - name: Verify syncthing responds
        run: |
          for i in $(seq 1 12); do
            status=$(curl -sf http://127.0.0.1:8384/rest/noauth/health 2>/dev/null | jq -r '.status' 2>/dev/null)
            if [ "$status" = "OK" ]; then
              echo "syncthing healthy"
              exit 0
            fi
            echo "syncthing not ready yet (attempt $i/12), retrying in 5s..."
            sleep 5
          done
          echo "syncthing never became healthy after 60s"
          exit 1

      # 127.0.0.1 bypasses the firewall entirely, so it can't test fix-home-net.sh
      # These steps simulate real LAN devices and a VPN peer via netns/veth instead
      - name: Set up simulated LAN peers and a fake WireGuard interface
        run: |
          # Bridge standing in for the shared home LAN segment
          sudo ip link add br-lan-test type bridge
          sudo ip addr add 10.99.99.1/24 dev br-lan-test
          sudo ip link set br-lan-test up

          # Trusted peer: its MAC/IP will go into TRUSTED_LAN_DEVICES below
          sudo ip netns add trusted-peer
          sudo ip link add vtrust type veth peer name vtrust-br
          sudo ip link set vtrust netns trusted-peer
          sudo ip link set vtrust-br master br-lan-test up
          sudo ip netns exec trusted-peer ip addr add 10.99.99.10/24 dev vtrust
          sudo ip netns exec trusted-peer ip link set vtrust up
          sudo ip netns exec trusted-peer ip link set lo up
          sudo ip netns exec trusted-peer ip route add default via 10.99.99.1

          # Untrusted peer: same setup, but never added to the allowlist
          sudo ip netns add untrusted-peer
          sudo ip link add vuntr type veth peer name vuntr-br
          sudo ip link set vuntr netns untrusted-peer
          sudo ip link set vuntr-br master br-lan-test up
          sudo ip netns exec untrusted-peer ip addr add 10.99.99.11/24 dev vuntr
          sudo ip netns exec untrusted-peer ip link set vuntr up
          sudo ip netns exec untrusted-peer ip link set lo up
          sudo ip netns exec untrusted-peer ip route add default via 10.99.99.1

          # fix-home-net.sh trusts anything arriving on an interface literally
          # named wg0, regardless of source -- this stands in for the tunnel.
          sudo ip netns add vpn-peer
          sudo ip link add wg0 type veth peer name veth-vpn-peer
          sudo ip link set veth-vpn-peer netns vpn-peer
          sudo ip addr add 10.13.13.1/24 dev wg0
          sudo ip link set wg0 up
          sudo ip netns exec vpn-peer ip addr add 10.13.13.2/24 dev veth-vpn-peer
          sudo ip netns exec vpn-peer ip link set veth-vpn-peer up
          sudo ip netns exec vpn-peer ip link set lo up
          sudo ip netns exec vpn-peer ip route add default via 10.13.13.1

          # Passed on to the next step, since each step here runs in its own shell
          echo "TRUSTED_MAC=$(sudo ip netns exec trusted-peer cat /sys/class/net/vtrust/address)" >> "$GITHUB_ENV"

      - name: Configure TRUSTED_LAN_DEVICES for the simulated trusted peer
        working-directory: services
        run: |
          # Only the trusted peer's IP@MAC goes in, so the untrusted one stays untrusted
          cp ../.env.example .env
          sed -i '/^TRUSTED_LAN_DEVICES=/d' .env
          echo "TRUSTED_LAN_DEVICES=10.99.99.10@${TRUSTED_MAC}" >> .env

      - name: Run fix-home-net.sh
        run: sudo ./scripts/fix-home-net.sh

      # TEMPORARY: debugging why the untrusted peer isn't blocked in CI.
      - name: Dump firewall state (debug)
        run: |
          echo "=== iptables -S (everything) ==="
          sudo iptables -S
          echo "=== nat table, DOCKER chain ==="
          sudo iptables -t nat -L DOCKER -v -n
          echo "=== filter table, with hit counters ==="
          sudo iptables -L FORWARD -v -n --line-numbers
          sudo iptables -L DOCKER-USER -v -n --line-numbers
          sudo iptables -L DOCKER_GUARD -v -n --line-numbers
          sudo iptables -L TRUSTED_LAN -v -n --line-numbers
          sudo iptables -L DOCKER -v -n --line-numbers

      - name: Verify trusted LAN peer can reach jellyfin
        run: sudo ip netns exec trusted-peer curl -sf --max-time 5 http://10.99.99.1:8096/health

      - name: Verify untrusted LAN peer cannot reach jellyfin
        run: |
          if sudo ip netns exec untrusted-peer curl -sf --max-time 5 http://10.99.99.1:8096/health; then
            echo "untrusted peer reached jellyfin -- firewall is not blocking it"
            exit 1
          fi
          echo "untrusted peer correctly blocked"

      # TEMPORARY: same dump as above, but with updated hit counters after the
      # untrusted peer's attempt, and it runs even if that step failed.
      - name: Dump firewall state after the untrusted-peer attempt (debug)
        if: always()
        run: |
          echo "=== filter table, with hit counters ==="
          sudo iptables -L FORWARD -v -n --line-numbers
          sudo iptables -L DOCKER-USER -v -n --line-numbers
          sudo iptables -L DOCKER_GUARD -v -n --line-numbers
          sudo iptables -L TRUSTED_LAN -v -n --line-numbers
          sudo iptables -L DOCKER -v -n --line-numbers
          echo "=== conntrack entries for port 8096 ==="
          sudo conntrack -L 2>&1 | grep 8096 || echo "(none found, or conntrack tool unavailable)"

      - name: Verify simulated WireGuard peer can reach jellyfin
        run: sudo ip netns exec vpn-peer curl -sf --max-time 5 http://10.13.13.1:8096/health

      - name: Verify container egress still works
        run: sudo docker exec jellyfin curl -sf --max-time 5 -o /dev/null http://example.com/

      - name: Clean up simulated network namespaces
        if: always()
        run: |
          sudo ip netns del trusted-peer 2>/dev/null || true
          sudo ip netns del untrusted-peer 2>/dev/null || true
          sudo ip netns del vpn-peer 2>/dev/null || true
          sudo ip link del br-lan-test 2>/dev/null || true
          sudo ip link del wg0 2>/dev/null || true
