name: Install Smoke Test

on:
  push:
    branches: ["main", "dev"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: install-smoke-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vps-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Run VPS quick-start install
        run: sudo ./scripts/easy-install.sh

      - name: Verify fail2ban is active
        run: |
          sudo systemctl is-active --quiet fail2ban
          sudo fail2ban-client status sshd > /dev/null

      - name: Verify root SSH login and password auth are disabled
        run: |
          sudo sshd -T 2>/dev/null | grep '^permitrootlogin no$' >/dev/null
          sudo sshd -T 2>/dev/null | grep '^passwordauthentication no$' >/dev/null

      - name: Verify unattended-upgrades is active
        run: sudo systemctl is-active --quiet unattended-upgrades

      - name: Verify wireguard container is running
        run: |
          sudo docker compose up -d --wait --wait-timeout 120 || {
            echo "wireguard container did not become ready in time"
            sudo docker compose logs
            exit 1
          }

      - name: Run network config check
        run: |
          output=$(sudo ./scripts/check-network-config-vps.sh 2>&1)
          echo "$output"
          if echo "$output" | grep -q ERROR; then
            echo "check-network-config-vps.sh reported at least one ERROR"
            exit 1
          fi

      - name: Verify wireguard peer config was generated
        run: sudo docker exec wireguard test -s /config/peer1/peer1.conf

      - name: Verify wg0 interface has a peer configured
        run: |
          for i in $(seq 1 12); do
            output=$(sudo docker exec wireguard wg show wg0 2>&1) || true
            if echo "$output" | grep -q "peer:"; then
              echo "$output"
              echo "wg0 has a peer configured"
              exit 0
            fi
            echo "wg0 not ready yet (attempt $i/12): $output"
            sleep 5
          done
          echo "$output"
          echo "wg0 has no peer configured after 60s"
          exit 1

      - name: Set up a WireGuard client peer
        run: |
          sudo docker cp wireguard:/config/peer1/peer1.conf ./peer1.conf
          sudo chown "$(id -u):$(id -g)" ./peer1.conf
          chmod 600 ./peer1.conf
          gateway=$(sudo docker network inspect bridge --format '{{(index .IPAM.Config 0).Gateway}}')
          image=$(sudo docker compose config --format json | jq -r '.services.wireguard.image')
          sed "s|^Endpoint = .*|Endpoint = ${gateway}:51820|" ./peer1.conf > ./client-wg0.conf
          sudo chmod 600 ./client-wg0.conf
          grep -v -E '^(PrivateKey|PresharedKey) = ' ./client-wg0.conf
          sudo docker run -d --name wg-client --cap-add=NET_ADMIN \
            --sysctl net.ipv4.conf.all.src_valid_mark=1 \
            -v "$(pwd)/client-wg0.conf:/etc/wireguard/wg0.conf" \
            "$image"

      - name: Trigger a handshake attempt
        run: sudo docker exec wg-client sh -c "ping -c 2 -W 2 10.13.13.1" || true

      - name: Verify WireGuard handshake succeeded
        run: .github/scripts/wait-for-wg-handshake.sh wg-client

      - name: Verify tunnel forwards traffic to the internet
        # GitHub-hosted runners drop outbound ping entirely
        # This checks real TCP connectivity through the tunnel
        run: |
          if ! sudo docker exec wg-client wget -q --no-check-certificate --timeout=5 https://1.1.1.1; then
            echo "wg-client completed the handshake but could not reach the internet through the tunnel"
            sudo docker exec wireguard wg show wg0
            exit 1
          fi
          echo "external HTTPS request through the tunnel succeeded"

      - name: Clean up client container
        if: always()
        run: sudo docker rm -f wg-client || true

      # install-wireguard.sh expects a separate controller SSH-ing into a target and a VPS.
      # The VPS role is simulated via loopback SSH (127.0.0.1, reusing peer1 from the checks
      # above). The target role can't share that loopback though: the wireguard container above
      # runs with network_mode: host, so its own wg0 interface and UDP 51820 already occupy this
      # runner's netns -- a second wg-quick@wg0 here would collide on both. So the target role
      # gets its own container, in its own (non-host) network namespace, with real systemd
      # (install-wireguard.sh drives it entirely over ssh + systemctl + journalctl).
      - name: Set up loopback SSH for install-wireguard.sh's VPS role
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          sudo systemctl enable --now ssh
          ssh-keygen -t ed25519 -N "" -f ~/.ssh/ci_loopback_key
          cat ~/.ssh/ci_loopback_key.pub >> ~/.ssh/authorized_keys
          chmod 600 ~/.ssh/authorized_keys
          {
            echo "Host 127.0.0.1"
            echo "    User $(whoami)"
            echo "    IdentityFile ~/.ssh/ci_loopback_key"
            echo "    StrictHostKeyChecking accept-new"
          } >> ~/.ssh/config
          chmod 600 ~/.ssh/config
          # install-wireguard.sh's VPS side does "cd ~/wireguard-docker-hub"
          ln -sfn "$GITHUB_WORKSPACE" ~/wireguard-docker-hub

      - name: Set up an isolated target container for install-wireguard.sh
        run: |
          mkdir -p /tmp/wg-target
          {
            echo 'FROM ubuntu:24.04'
            echo 'ENV DEBIAN_FRONTEND=noninteractive'
            echo 'RUN apt-get update -qq \'
            echo '    && apt-get install -y -qq systemd systemd-sysv openssh-server sudo iproute2 \'
            echo '    && apt-get clean && rm -rf /var/lib/apt/lists/*'
          } > /tmp/wg-target/Dockerfile
          sudo docker build -q -t wg-target-img /tmp/wg-target

          # Real systemd as PID 1, its own netns (no --network host), NET_ADMIN for wg-quick.
          # install-wireguard.sh installs wireguard/resolvconf itself -- not baked in here,
          # that's part of what's under test.
          sudo docker run -d --name wg-target --privileged --cgroupns=host \
            --sysctl net.ipv4.conf.all.src_valid_mark=1 \
            -v /sys/fs/cgroup:/sys/fs/cgroup:rw \
            wg-target-img /sbin/init

          for i in $(seq 1 20); do
            sudo docker exec wg-target true 2>/dev/null && break
            sleep 1
          done

          sudo docker exec wg-target useradd -m -s /bin/bash runner
          echo "runner ALL=(ALL) NOPASSWD:ALL" | sudo docker exec -i wg-target tee /etc/sudoers.d/runner > /dev/null
          sudo docker exec wg-target mkdir -p /home/runner/.ssh
          cat ~/.ssh/ci_loopback_key.pub | sudo docker exec -i wg-target tee /home/runner/.ssh/authorized_keys > /dev/null
          sudo docker exec wg-target bash -c "chown -R runner:runner /home/runner/.ssh && chmod 700 /home/runner/.ssh && chmod 600 /home/runner/.ssh/authorized_keys"
          sudo docker exec wg-target ssh-keygen -A
          sudo docker exec wg-target systemctl enable --now ssh

          target_ip=$(sudo docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' wg-target)
          echo "TARGET_IP=$target_ip" >> "$GITHUB_ENV"
          {
            echo "Host $target_ip"
            echo "    User runner"
            echo "    IdentityFile ~/.ssh/ci_loopback_key"
            echo "    StrictHostKeyChecking accept-new"
          } >> ~/.ssh/config

      # peer1's real Endpoint (the runner's public IP) is unreachable from the runner itself.
      # The docker bridge gateway is reachable both from the runner (VPS role) and from any
      # container on that same bridge network (the target container's role).
      - name: Point peer1 at the docker bridge for install-wireguard.sh
        run: |
          gateway=$(sudo docker network inspect bridge --format '{{(index .IPAM.Config 0).Gateway}}')
          sudo docker cp wireguard:/config/peer1/peer1.conf /tmp/peer1.conf
          sudo sed -i "s|^Endpoint = .*|Endpoint = ${gateway}:51820|" /tmp/peer1.conf
          sudo docker cp /tmp/peer1.conf wireguard:/config/peer1/peer1.conf

      - name: Verify install-wireguard.sh rejects an unknown flag
        run: |
          set +e
          output=$(./services/install-wireguard.sh "$TARGET_IP" 127.0.0.1 1 --bogus 2>&1)
          exit_status=$?
          set -e
          echo "$output"

          if [ "$exit_status" -eq 0 ]; then
            echo "expected install-wireguard.sh to reject an unknown flag, but it exited 0"
            exit 1
          fi
          if ! echo "$output" | grep -q "unknown flag"; then
            echo "expected the unknown-flag error message, got something else instead"
            exit 1
          fi

      - name: Verify install-wireguard.sh rejects an extra positional argument
        run: |
          set +e
          output=$(./services/install-wireguard.sh "$TARGET_IP" 127.0.0.1 1 extra-arg 2>&1)
          exit_status=$?
          set -e
          echo "$output"

          if [ "$exit_status" -eq 0 ]; then
            echo "expected install-wireguard.sh to reject an extra positional argument, but it exited 0"
            exit 1
          fi
          if ! echo "$output" | grep -q "too many arguments"; then
            echo "expected the too-many-arguments error message, got something else instead"
            exit 1
          fi

      - name: Run install-wireguard.sh
        run: ./services/install-wireguard.sh "$TARGET_IP" 127.0.0.1 1 --yes

      - name: Verify install-wireguard.sh handshake succeeded
        run: .github/scripts/wait-for-wg-handshake.sh wg-target

      - name: Verify install-wireguard.sh reports already up to date
        run: |
          output=$(./services/install-wireguard.sh "$TARGET_IP" 127.0.0.1 1 --yes) || true
          echo "$output"
          if ! echo "$output" | grep -q "Already up to date"; then
            echo "expected an unchanged re-run to report 'already up to date'"
            exit 1
          fi

      # Change a non-key field, so this time the diff is real and gets applied. Runs before the
      # dry-run check below so a backup already exists on disk -- otherwise "no backup file" would
      # be true whether or not --dry-run is the reason, since nothing yet would have created one
      - name: Verify install-wireguard.sh applies a real change and backs it up
        run: |
          sudo docker cp wireguard:/config/peer1/peer1.conf /tmp/peer1.conf
          sudo sed -i 's/^DNS = .*/DNS = 9.9.9.9,149.112.112.112/' /tmp/peer1.conf
          sudo docker cp /tmp/peer1.conf wireguard:/config/peer1/peer1.conf

          output=$(./services/install-wireguard.sh "$TARGET_IP" 127.0.0.1 1 --yes) || true
          echo "$output"

          if ! sudo docker exec wg-target grep -q '^DNS = 9.9.9.9,149.112.112.112' /etc/wireguard/wg0.conf; then
            echo "the new DNS value was not applied to the target"
            exit 1
          fi
          if ! sudo docker exec wg-target bash -c 'compgen -G "/etc/wireguard/wg0.conf.bak.*"' > /dev/null; then
            echo "expected a backup of the previous config before applying the change"
            exit 1
          fi
          if ! echo "$output" | grep -q "Reloaded wg-quick@wg0"; then
            echo "expected the restart branch (interface was already enabled), not enable --now"
            exit 1
          fi

      # Rotate PrivateKey only, so the raw diff differs but the censored diff doesn't
      - name: Verify install-wireguard.sh --dry-run masks a key-only change
        run: |
          backups_before=$(sudo docker exec wg-target bash -c 'compgen -G "/etc/wireguard/wg0.conf.bak.*"' 2>/dev/null | wc -l) || true

          sudo docker cp wireguard:/config/peer1/peer1.conf /tmp/peer1-pristine.conf
          sudo sed 's/^PrivateKey = .*/PrivateKey = FAKE-KEY-FOR-CI-TESTING-ONLY-0123456789AB=/' \
            /tmp/peer1-pristine.conf | sudo tee /tmp/peer1-fakekey.conf > /dev/null
          sudo docker cp /tmp/peer1-fakekey.conf wireguard:/config/peer1/peer1.conf

          output=$(./services/install-wireguard.sh "$TARGET_IP" 127.0.0.1 1 --dry-run) || true
          echo "$output"
          sudo docker cp /tmp/peer1-pristine.conf wireguard:/config/peer1/peer1.conf

          if ! echo "$output" | grep -q "only PrivateKey/PresharedKey changed"; then
            echo "expected the key-only-change message on a masked dry-run diff"
            exit 1
          fi
          if echo "$output" | grep -q "FAKE-KEY-FOR-CI-TESTING-ONLY"; then
            echo "the fake private key leaked into the dry-run output"
            exit 1
          fi

          # A backup already exists from the real-change step above; --dry-run must not add another one
          backups_after=$(sudo docker exec wg-target bash -c 'compgen -G "/etc/wireguard/wg0.conf.bak.*"' 2>/dev/null | wc -l) || true
          if [ "$backups_after" -ne "$backups_before" ]; then
            echo "--dry-run should not create a backup ($backups_before before, $backups_after after)"
            exit 1
          fi

      - name: Verify install-wireguard.sh handshake still succeeds after re-apply
        run: .github/scripts/wait-for-wg-handshake.sh wg-target

      - name: Clean up install-wireguard.sh target container
        if: always()
        run: sudo docker rm -f wg-target || true

  home-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install Docker (same script the home server uses)
        run: sudo ./scripts/basic-install.sh

      - name: Verify fail2ban is active
        run: |
          sudo systemctl is-active --quiet fail2ban
          sudo fail2ban-client status sshd > /dev/null

      - name: Verify root SSH login and password auth are disabled
        run: |
          sudo sshd -T 2>/dev/null | grep '^permitrootlogin no$' >/dev/null
          sudo sshd -T 2>/dev/null | grep '^passwordauthentication no$' >/dev/null

      - name: Verify unattended-upgrades is active
        run: sudo systemctl is-active --quiet unattended-upgrades

      # SECURITY: this reconfigures the runner's own DNS resolver
      # Safe only because this is a GitHub runner destroyed after the job
      # Never run this job on a self-hosted/persistent runner.
      - name: Free port 53 for adguard (disable systemd-resolved's stub listener)
        run: |
          sudo mkdir -p /etc/systemd/resolved.conf.d
          printf '[Resolve]\nDNSStubListener=no\n' | sudo tee /etc/systemd/resolved.conf.d/no-stub.conf > /dev/null
          sudo systemctl restart systemd-resolved

          # Pin real nameservers and lock the file so nothing reverts it to the now-unbound 127.0.0.53 stub.
          sudo rm -f /etc/resolv.conf
          printf 'nameserver 1.1.1.1\nnameserver 8.8.8.8\n' | sudo tee /etc/resolv.conf > /dev/null
          sudo chattr +i /etc/resolv.conf

          # dockerd caches resolv.conf at startup, so restart it now that DNS is fixed.
          sudo systemctl restart docker

      - name: Set required nginx env vars for the smoke test
        working-directory: services
        run: |
          echo "LAN_SUBNET=192.168.1.0/24" > .env
          echo "VPN_SUBNET=10.13.13.0/24" >> .env

      - name: Verify generate-nginx-certs.sh rejects an unknown flag
        working-directory: services
        run: |
          set +e
          output=$(./generate-nginx-certs.sh --bogus 2>&1)
          exit_status=$?
          set -e
          echo "$output"

          if [ "$exit_status" -eq 0 ]; then
            echo "expected generate-nginx-certs.sh to reject an unknown flag, but it exited 0"
            exit 1
          fi
          if ! echo "$output" | grep -q "unknown flag"; then
            echo "expected the shared force-flag parser's error message, got something else instead"
            exit 1
          fi
          if [ -f nginx/certs/cert.pem ]; then
            echo "rejecting an unknown flag must not generate a cert"
            exit 1
          fi

      - name: Verify generate-nginx-certs.sh rejects a root-owned certs dir
        working-directory: services
        run: |
          # Simulates `docker compose up` auto-creating this dir as root before the script ever runs.
          sudo mkdir -p nginx/certs
          sudo chown root:root nginx/certs

          # Capture the exit code ourselves, a failure here would otherwise stop the step
          set +e
          output=$(./generate-nginx-certs.sh 2>&1)
          exit_status=$?
          set -e
          echo "$output"

          if [ "$exit_status" -eq 0 ]; then
            echo "expected generate-nginx-certs.sh to fail on a root-owned nginx/certs, but it exited 0"
            exit 1
          fi
          if ! echo "$output" | grep -q "isn't a writable directory"; then
            echo "expected the clear permission-guard error message, got something else instead"
            exit 1
          fi

          sudo rm -rf nginx/certs

      - name: Verify generate-adguard-config.sh rejects a root-owned conf dir
        working-directory: services
        run: |
          # Simulates `docker compose up` auto-creating this dir as root before the script ever runs.
          sudo mkdir -p adguard/conf
          sudo chown root:root adguard/conf

          # Capture the exit code ourselves, a failure here would otherwise stop the step
          set +e
          output=$(ADGUARD_SETUP_USER=admin ADGUARD_SETUP_PASSWORD=CI-TESTING-ONLY-NOT-A-REAL-PASSWORD ./generate-adguard-config.sh 2>&1)
          exit_status=$?
          set -e
          echo "$output"

          if [ "$exit_status" -eq 0 ]; then
            echo "expected generate-adguard-config.sh to fail on a root-owned adguard/conf, but it exited 0"
            exit 1
          fi
          if ! echo "$output" | grep -q "isn't a writable directory"; then
            echo "expected the clear permission-guard error message, got something else instead"
            exit 1
          fi

          sudo rm -rf adguard/conf

      - name: Generate AdGuard config for the smoke test
        working-directory: services
        run: |
          export ADGUARD_SETUP_USER=admin
          export ADGUARD_SETUP_PASSWORD=CI-TESTING-ONLY-NOT-A-REAL-PASSWORD
          # The runner isn't on LAN_SUBNET and has no wg0, so both overrides are needed
          export ADGUARD_LAN_IP=192.168.1.10
          export ADGUARD_VPN_IP=10.13.13.10
          sudo -E ./generate-adguard-config.sh
          # Created as root under sudo above, must match the compose file's user: 1000:1000
          sudo chown -R 1000:1000 adguard

      - name: Generate nginx certs for the smoke test
        working-directory: services
        run: ./generate-nginx-certs.sh

      - name: Start services stack
        working-directory: services
        run: |
          pulled=false
          for attempt in 1 2 3 4 5; do
            if sudo docker compose pull; then
              pulled=true
              break
            fi
            echo "pull failed (attempt $attempt/5, likely Docker Hub rate-limiting), retrying in 15s..."
            sleep 15
          done
          if [ "$pulled" != "true" ]; then
            echo "gave up after 5 pull attempts, not starting the stack"
            exit 1
          fi
          sudo docker compose up -d --wait --wait-timeout 120 || {
            echo "services did not become ready in time"
            sudo docker compose logs
            exit 1
          }

      - name: Install dig for DNS check
        run: sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq dnsutils

      - name: Verify AdGuard resolves DNS
        run: |
          for i in $(seq 1 12); do
            ip=$(dig +short @127.0.0.1 google.com | head -n1)
            if [ -n "$ip" ]; then
              echo "adguard resolved google.com -> $ip"
              exit 0
            fi
            echo "adguard not answering yet (attempt $i/12), retrying in 5s..."
            sleep 5
          done
          echo "adguard never resolved a DNS query after 60s"
          exit 1

      # Split-horizon: same hostname, different answer depending on the querier's source IP.
      # Querying @127.0.0.1 won't work: Docker's hairpin NAT masks the real source, so real
      # simulated peers are used instead, same as the firewall checks further down.
      - name: Verify generate-adguard-config.sh set the split-horizon DNS rewrites automatically
        run: |
          # veth names have to fit Linux's 15-char IFNAMSIZ limit, so they use a short tag
          # instead of the (more readable) netns/bridge names below
          new_dns_test_peer() {
              local ns="$1" bridge="$2" bridge_ip="$3" peer_ip="$4" tag="$5"
              sudo ip link add "$bridge" type bridge
              sudo ip addr add "$bridge_ip/24" dev "$bridge"
              sudo ip link set "$bridge" up
              sudo ip netns add "$ns"
              sudo ip link add "veth-$tag" type veth peer name "veth-$tag-br"
              sudo ip link set "veth-$tag" netns "$ns"
              sudo ip link set "veth-$tag-br" master "$bridge" up
              sudo ip netns exec "$ns" ip addr add "$peer_ip/24" dev "veth-$tag"
              sudo ip netns exec "$ns" ip link set "veth-$tag" up
              sudo ip netns exec "$ns" ip link set lo up
              sudo ip netns exec "$ns" ip route add default via "$bridge_ip"
          }
          cleanup_dns_test_peers() {
              sudo ip netns del lan-dns-peer 2>/dev/null || true
              sudo ip netns del vpn-dns-peer 2>/dev/null || true
              sudo ip link del br-lan-dns-test 2>/dev/null || true
              sudo ip link del br-vpn-dns-test 2>/dev/null || true
          }
          trap cleanup_dns_test_peers EXIT

          new_dns_test_peer lan-dns-peer br-lan-dns-test 192.168.1.50 192.168.1.51 lan
          new_dns_test_peer vpn-dns-peer br-vpn-dns-test 10.13.13.50 10.13.13.51 vpn

          for host in adguard.home.arpa jellyfin.home.arpa syncthing.home.arpa; do
            lan_ip=$(sudo ip netns exec lan-dns-peer dig +short @192.168.1.50 "$host")
            if [ "$lan_ip" != "192.168.1.10" ]; then
              echo "expected $host to resolve to 192.168.1.10 (ADGUARD_LAN_IP) from a LAN-sourced query, got '$lan_ip'"
              exit 1
            fi
            vpn_ip=$(sudo ip netns exec vpn-dns-peer dig +short @10.13.13.50 "$host")
            if [ "$vpn_ip" != "10.13.13.10" ]; then
              echo "expected $host to resolve to 10.13.13.10 (ADGUARD_VPN_IP) from a VPN-sourced query, got '$vpn_ip'"
              exit 1
            fi
          done
          echo "all three nginx hostnames resolve correctly per zone (split-horizon)"

      # Runs against an isolated copy in /tmp so none of these paths touch the real
      # stack or state relied on by the steps before/after this one.
      - name: Verify generate-adguard-config.sh's other DNS-rewrite paths
        working-directory: services
        run: |
          ORIG_DIR="$PWD"
          REPO_DIR="$(dirname "$ORIG_DIR")"
          TESTDIR=/tmp/adguard-rewrite-paths
          rm -rf "$TESTDIR" /tmp/adguard-rewrite-paths-data
          mkdir -p "$TESTDIR" /tmp/adguard-rewrite-paths-data
          # Also copies scripts/, generate-adguard-config.sh sources scripts/lib/colors.sh via ../
          # sudo: adguard/conf and adguard/work are chown'd to 1000:1000 by earlier steps, and
          # aren't necessarily readable by the runner user -- reclaim ownership after copying
          sudo cp -r "$REPO_DIR/scripts" "$REPO_DIR/services" "$TESTDIR/"
          sudo chown -R "$(id -u):$(id -g)" "$TESTDIR"
          cd "$TESTDIR/services"
          # Own .env, and drop the real config this copied from -- both would short-circuit the checks below
          cat > .env <<'ENVEOF'
          TZ=Etc/UTC
          LAN_SUBNET=192.168.1.0/24
          VPN_SUBNET=10.13.13.0/24
          SYNCTHING_MOUNT_1=/tmp/adguard-rewrite-paths-data:/data1
          JELLYFIN_MEDIA_1=/tmp/adguard-rewrite-paths-data:/media
          ENVEOF
          rm -f adguard/conf/AdGuardHome.yaml

          # --- Path: no ADGUARD_LAN_IP override, and this runner isn't on LAN_SUBNET ---
          set +e
          output=$(ADGUARD_SETUP_USER=admin ADGUARD_SETUP_PASSWORD=CI-TESTING-ONLY-NOT-A-REAL-PASSWORD ./generate-adguard-config.sh 2>&1)
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "expected autodetection to fail on a runner not on LAN_SUBNET, but it exited 0"
            exit 1
          fi
          if ! echo "$output" | grep -q "couldn't detect this host's IP"; then
            echo "expected the clear autodetection-failure error, got:"
            echo "$output"
            exit 1
          fi
          if [ -f adguard/conf/AdGuardHome.yaml ]; then
            echo "autodetection failure must not leave a generated config behind"
            exit 1
          fi
          echo "autodetection without ADGUARD_LAN_IP correctly fails with a clear error"

          # --- Path: ADGUARD_LAN_IP given, but no ADGUARD_VPN_IP and no wg0 on this runner ---
          set +e
          output=$(ADGUARD_SETUP_USER=admin ADGUARD_SETUP_PASSWORD=CI-TESTING-ONLY-NOT-A-REAL-PASSWORD ADGUARD_LAN_IP=192.168.1.10 ./generate-adguard-config.sh 2>&1)
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "expected wg0 autodetection to fail on a runner with no WireGuard interface, but it exited 0"
            exit 1
          fi
          if ! echo "$output" | grep -q "couldn't detect this host's WireGuard tunnel IP"; then
            echo "expected the clear wg0 autodetection-failure error, got:"
            echo "$output"
            exit 1
          fi
          if [ -f adguard/conf/AdGuardHome.yaml ]; then
            echo "wg0 autodetection failure must not leave a generated config behind"
            exit 1
          fi
          echo "autodetection without ADGUARD_VPN_IP correctly fails with a clear error"

          # --- Path: interactive confirmation, answering "n", must abort without writing anything ---
          set +e
          output=$(printf 'admin\nCI-TESTING-ONLY-NOT-A-REAL-PASSWORD\nCI-TESTING-ONLY-NOT-A-REAL-PASSWORD\nn\n' | ADGUARD_LAN_IP=192.168.1.10 ADGUARD_VPN_IP=10.13.13.10 ./generate-adguard-config.sh 2>&1)
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "expected answering 'n' to abort, but it exited 0"
            exit 1
          fi
          if ! echo "$output" | grep -q "Aborted, nothing changed."; then
            echo "expected the abort message, got:"
            echo "$output"
            exit 1
          fi
          if [ -f adguard/conf/AdGuardHome.yaml ]; then
            echo "answering 'n' must not leave a generated config behind"
            exit 1
          fi
          echo "interactive 'n' correctly aborts without writing"

          # --- Path: interactive confirmation, answering "y", must proceed and write the file ---
          printf 'admin\nCI-TESTING-ONLY-NOT-A-REAL-PASSWORD\nCI-TESTING-ONLY-NOT-A-REAL-PASSWORD\ny\n' | ADGUARD_LAN_IP=192.168.1.10 ADGUARD_VPN_IP=10.13.13.10 ./generate-adguard-config.sh
          if ! grep -q "dnsrewrite=NOERROR;A;192.168.1.10,client=192.168.1.0/24" adguard/conf/AdGuardHome.yaml; then
            echo "expected the LAN-zone rewrites to be written after answering 'y'"
            exit 1
          fi
          if ! grep -q "dnsrewrite=NOERROR;A;10.13.13.10,client=10.13.13.0/24" adguard/conf/AdGuardHome.yaml; then
            echo "expected the VPN-zone rewrites to be written after answering 'y'"
            exit 1
          fi
          echo "interactive 'y' correctly proceeds and writes the split-horizon rewrites"

          # --- Path: generate -> snapshot -> generate must not accumulate blank lines/empty
          # entries in user_rules: (regression test: USER_RULES_BLOCK already ends in \n, so a
          # bare awk `print` on top of it left a trailing blank line that got treated as a
          # foreign rule on the next regenerate and persisted as a literal `- ''` entry) ---
          ./snapshot-adguard-config.sh
          rm -f adguard/conf/AdGuardHome.yaml
          ADGUARD_SETUP_USER=admin ADGUARD_SETUP_PASSWORD=CI-TESTING-ONLY-NOT-A-REAL-PASSWORD ADGUARD_LAN_IP=192.168.1.10 ADGUARD_VPN_IP=10.13.13.10 ./generate-adguard-config.sh --force

          block=$(awk '/^user_rules:/{f=1} f && !/^user_rules:/ && /^[^ ]/{exit} f' adguard/conf/AdGuardHome.yaml)
          rule_count=$(echo "$block" | grep -c "^  - ")
          if [ "$rule_count" -ne 6 ]; then
            echo "expected exactly 6 user_rules entries after a generate -> snapshot -> generate cycle, got $rule_count:"
            echo "$block"
            exit 1
          fi
          if echo "$block" | grep -qE '^\s*$'; then
            echo "found a blank line inside user_rules: after a generate -> snapshot -> generate cycle:"
            echo "$block"
            exit 1
          fi
          if echo "$block" | grep -q "^  - ''"; then
            echo "found a spurious empty user_rules entry after a generate -> snapshot -> generate cycle:"
            echo "$block"
            exit 1
          fi
          echo "generate -> snapshot -> generate does not accumulate blank lines or empty entries in user_rules:"

          # --- Path: template's password: line format changes, the awk substitution guard must catch it ---
          rm -f adguard/conf/AdGuardHome.yaml
          cp adguard/AdGuardHome.yaml.template /tmp/AdGuardHome.yaml.template.bak
          sed -i 's/^    password:/  password:/' adguard/AdGuardHome.yaml.template

          set +e
          output=$(ADGUARD_SETUP_USER=admin ADGUARD_SETUP_PASSWORD=CI-TESTING-ONLY-NOT-A-REAL-PASSWORD ADGUARD_LAN_IP=192.168.1.10 ADGUARD_VPN_IP=10.13.13.10 ./generate-adguard-config.sh 2>&1)
          status=$?
          set -e
          mv /tmp/AdGuardHome.yaml.template.bak adguard/AdGuardHome.yaml.template

          if [ "$status" -eq 0 ]; then
            echo "expected generate-adguard-config.sh to fail when the template's password: line format changed, but it exited 0"
            exit 1
          fi
          if ! echo "$output" | grep -q "couldn't substitute the admin name/password"; then
            echo "expected the awk substitution-guard error, got:"
            echo "$output"
            exit 1
          fi
          if [ -f adguard/conf/AdGuardHome.yaml ]; then
            echo "a failed substitution must not leave a generated config file behind"
            exit 1
          fi
          echo "a malformed template password: line correctly triggers the substitution guard"

          # --- Path: admin username/password with JSON-breaking characters must round-trip via jq's escaping ---
          rm -f adguard/conf/AdGuardHome.yaml
          set +e
          output=$(ADGUARD_SETUP_USER='admin"quote\backslash' ADGUARD_SETUP_PASSWORD='Pass"Word\With-Specials1' ADGUARD_LAN_IP=192.168.1.10 ADGUARD_VPN_IP=10.13.13.10 ./generate-adguard-config.sh 2>&1)
          status=$?
          set -e
          echo "$output"

          if [ "$status" -ne 0 ] || [ ! -f adguard/conf/AdGuardHome.yaml ]; then
            echo "expected generate-adguard-config.sh to succeed with quotes/backslashes in the username/password"
            exit 1
          fi
          echo "username/password containing quotes and backslashes correctly round-trip through jq's JSON escaping"

          # --- Path: nginx not part of this deployment (service block removed) skips rewrites entirely ---
          rm -f adguard/conf/AdGuardHome.yaml
          # The snapshot path above overwrote this template; restore the pristine one from the repo
          cp "$REPO_DIR/services/adguard/AdGuardHome.yaml.template" adguard/AdGuardHome.yaml.template
          python3 - <<'PYEOF'
          import re
          with open("docker-compose.yml") as f:
              content = f.read()
          content = re.sub(r'  nginx:.*?(?=\n  adguard:)', '', content, flags=re.S)
          with open("docker-compose.yml", "w") as f:
              f.write(content)
          PYEOF
          output=$(ADGUARD_SETUP_USER=admin ADGUARD_SETUP_PASSWORD=CI-TESTING-ONLY-NOT-A-REAL-PASSWORD ./generate-adguard-config.sh 2>&1)
          if echo "$output" | grep -qi "DNS rewrites for"; then
            echo "expected no DNS-rewrite handling at all when nginx isn't part of the deployment"
            exit 1
          fi
          if ! grep -q 'user_rules: \[\]' adguard/conf/AdGuardHome.yaml; then
            echo "expected the template's untouched (empty) user_rules: to pass through as-is"
            exit 1
          fi
          echo "no-nginx path correctly skips DNS-rewrite handling"

          cd "$ORIG_DIR"
          rm -rf "$TESTDIR" /tmp/adguard-rewrite-paths-data

      # Real change via the API (not a hand-edited file), so the snapshot below reflects
      # what an operator actually configuring AdGuard through its web UI would produce.
      - name: Add a real AdGuard config change via its API
        run: |
          curl -sf -c /tmp/adg-cookies.txt -X POST http://127.0.0.1:8080/control/login \
            -H "Content-Type: application/json" \
            -d '{"name":"admin","password":"CI-TESTING-ONLY-NOT-A-REAL-PASSWORD"}' > /dev/null
          curl -sf -b /tmp/adg-cookies.txt -X POST http://127.0.0.1:8080/control/rewrite/add \
            -H "Content-Type: application/json" \
            -d '{"domain":"ci-smoke-test.home.arpa","answer":"192.168.1.99"}' > /dev/null

      - name: Snapshot AdGuard config and verify the template captured the change
        working-directory: services
        run: |
          # Stopped so the live config file isn't being written while we copy it
          sudo docker compose stop adguard
          sudo ./snapshot-adguard-config.sh
          # The rewrite added via the API earlier must have made it into the template
          if ! grep -q "ci-smoke-test.home.arpa" adguard/AdGuardHome.yaml.template; then
            echo "the DNS rewrite added via the API is missing from the snapshotted template"
            exit 1
          fi
          # And the password line must be the redaction placeholder. Grepping for the raw
          # password instead would trivially "pass" either way, since AdGuard stores a bcrypt
          # hash, never the plaintext password, so it can't leak literally either way.
          if ! grep -q '^    password: "CENSURED: run generate-adguard-config.sh to set a real one"$' adguard/AdGuardHome.yaml.template; then
            echo "the password wasn't redacted in the snapshotted template"
            exit 1
          fi

      # A different password than before, so the checks below can tell rotation actually happened
      - name: Regenerate AdGuard from the template with a different password
        working-directory: services
        run: |
          export ADGUARD_SETUP_USER=admin
          export ADGUARD_SETUP_PASSWORD=CI-SECOND-PASSWORD-ALSO-NOT-REAL
          export ADGUARD_LAN_IP=192.168.1.10
          export ADGUARD_VPN_IP=10.13.13.10
          sudo -E ./generate-adguard-config.sh --force
          sudo chown -R 1000:1000 adguard
          # No manual "docker compose start adguard" here
          # The checks below rely on the script's own cleanup trap having restarted it

      - name: Verify the rewrite survived the template round-trip and the password rotated
        run: |
          # Restarting adguard takes a moment, so wait for it before hitting its API
          for i in $(seq 1 12); do
            curl -sf -o /dev/null http://127.0.0.1:8080/ && break
            echo "adguard not back up yet (attempt $i/12), retrying in 5s..."
            sleep 5
          done

          # The password from before the regenerate must no longer work
          old_login=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8080/control/login \
            -H "Content-Type: application/json" -d '{"name":"admin","password":"CI-TESTING-ONLY-NOT-A-REAL-PASSWORD"}')
          if [ "$old_login" = "200" ]; then
            echo "the old password still works -- regenerating from the template didn't rotate it"
            exit 1
          fi

          # And the new one from the regenerate step must
          new_login=$(curl -s -c /tmp/adg-cookies2.txt -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8080/control/login \
            -H "Content-Type: application/json" -d '{"name":"admin","password":"CI-SECOND-PASSWORD-ALSO-NOT-REAL"}')
          if [ "$new_login" != "200" ]; then
            echo "the new password from generate-adguard-config.sh --force doesn't work"
            exit 1
          fi

          # The rewrite added via the API, snapshotted into the template, must have come back too
          rewrites=$(curl -sf -b /tmp/adg-cookies2.txt http://127.0.0.1:8080/control/rewrite/list)
          if ! echo "$rewrites" | grep -q "ci-smoke-test.home.arpa"; then
            echo "the DNS rewrite from before the snapshot did not survive the template round-trip"
            exit 1
          fi

      # Regression test: a mid-script --force failure used to leave adguard stopped with its
      # live config already truncated (`> $OUT_FILE` destroys it before awk even runs).
      - name: Verify a failed --force regenerate doesn't take down or corrupt adguard
        working-directory: services
        run: |
          before_hash=$(sudo md5sum adguard/conf/AdGuardHome.yaml | cut -d' ' -f1)
          sudo cp adguard/AdGuardHome.yaml.template /tmp/AdGuardHome.yaml.template.bak
          sudo sed -i 's/^    password:/  password:/' adguard/AdGuardHome.yaml.template

          export ADGUARD_SETUP_USER=admin
          export ADGUARD_SETUP_PASSWORD=CI-THIRD-PASSWORD-ALSO-NOT-REAL
          export ADGUARD_LAN_IP=192.168.1.10
          export ADGUARD_VPN_IP=10.13.13.10
          set +e
          output=$(sudo -E ./generate-adguard-config.sh --force 2>&1)
          status=$?
          set -e
          sudo mv /tmp/AdGuardHome.yaml.template.bak adguard/AdGuardHome.yaml.template

          if [ "$status" -eq 0 ]; then
            echo "expected the corrupted template to make --force fail, but it exited 0"
            echo "$output"
            exit 1
          fi

          # adguard must come back up on its own, no manual "docker compose start" here
          up="false"
          for i in $(seq 1 12); do
            if curl -sf -o /dev/null http://127.0.0.1:8080/; then
              up="true"
              break
            fi
            echo "adguard not back up yet after the failed regenerate (attempt $i/12), retrying in 5s..."
            sleep 5
          done
          if [ "$up" != "true" ]; then
            echo "adguard never came back up after the failed --force regenerate"
            exit 1
          fi

          # And the config that was live before the failed attempt must be completely untouched
          after_hash=$(sudo md5sum adguard/conf/AdGuardHome.yaml | cut -d' ' -f1)
          if [ "$before_hash" != "$after_hash" ]; then
            echo "the live AdGuardHome.yaml changed even though the regenerate failed"
            exit 1
          fi

          # And the password from the successful regenerate two steps ago must still work
          still_login=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8080/control/login \
            -H "Content-Type: application/json" -d '{"name":"admin","password":"CI-SECOND-PASSWORD-ALSO-NOT-REAL"}')
          if [ "$still_login" != "200" ]; then
            echo "expected the pre-failure password to still work, got http $still_login"
            exit 1
          fi
          echo "a failed --force regenerate restarts adguard and leaves its live config untouched"

      # No compose healthcheck for jellyfin, its /health is unreliable during startup migrations
      # See: https://jellyfin.org/docs/general/post-install/networking/advanced/monitoring/
      - name: Verify jellyfin responds
        run: |
          for i in $(seq 1 12); do
            if curl -sf http://127.0.0.1:8096/health; then
              echo "jellyfin healthy"
              exit 0
            fi
            echo "jellyfin not ready yet (attempt $i/12), retrying in 5s..."
            sleep 5
          done
          echo "jellyfin never became healthy after 60s"
          exit 1

      - name: Verify nginx actually proxies to each backend, not just that it started
        working-directory: services
        run: |
          CACERT="nginx/certs/cert.pem"

          # nginx must redirect plain HTTP to HTTPS before proxying anywhere
          code=$(curl -s -o /dev/null -w '%{http_code}' --resolve jellyfin.home.arpa:80:127.0.0.1 http://jellyfin.home.arpa/)
          if [ "$code" != "301" ]; then
            echo "expected nginx to redirect HTTP to HTTPS with 301, got $code"
            exit 1
          fi

          # Each host's server block must reach its real backend through the resolver/upstream setup,
          # not just terminate TLS -- same endpoints already used to smoke-test each service directly above.
          # Headers go to a per-host file so the X-Client-Zone check below can reuse this same request.
          check_via_nginx() {
              host="$1"; path="$2"
              for i in $(seq 1 6); do
                  if curl -sf --cacert "$CACERT" --resolve "$host:443:127.0.0.1" -D "/tmp/nginx-check-$host.headers" "https://$host$path" > /dev/null; then
                      echo "nginx proxied https://$host$path"
                      return 0
                  fi
                  echo "https://$host$path not proxying yet (attempt $i/6), retrying in 5s..."
                  sleep 5
              done
              echo "nginx never successfully proxied https://$host$path after 30s"
              return 1
          }
          check_via_nginx adguard.home.arpa "/"
          check_via_nginx jellyfin.home.arpa "/health"
          check_via_nginx syncthing.home.arpa "/rest/noauth/health"

          # And it must be nginx doing the classifying, not just passing the backend's own response through
          zone_header=$(grep -i '^X-Client-Zone:' /tmp/nginx-check-jellyfin.home.arpa.headers)
          if [ -z "$zone_header" ]; then
            echo "expected an X-Client-Zone header set by nginx, got none"
            exit 1
          fi
          echo "$zone_header"

      # 127.0.0.1 bypasses the firewall entirely, so it can't test fix-home-net.sh
      # These steps simulate real LAN devices and a VPN peer via netns/veth instead
      - name: Set up simulated LAN peers and a fake WireGuard interface
        run: |
          # Bridge standing in for the shared home LAN segment
          sudo ip link add br-lan-test type bridge
          sudo ip addr add 10.99.99.1/24 dev br-lan-test
          sudo ip link set br-lan-test up

          # Trusted peer: its MAC/IP will go into TRUSTED_LAN_DEVICES below
          sudo ip netns add trusted-peer
          sudo ip link add vtrust type veth peer name vtrust-br
          sudo ip link set vtrust netns trusted-peer
          sudo ip link set vtrust-br master br-lan-test up
          sudo ip netns exec trusted-peer ip addr add 10.99.99.10/24 dev vtrust
          sudo ip netns exec trusted-peer ip link set vtrust up
          sudo ip netns exec trusted-peer ip link set lo up
          sudo ip netns exec trusted-peer ip route add default via 10.99.99.1

          # Untrusted peer: same setup, but never added to the allowlist
          sudo ip netns add untrusted-peer
          sudo ip link add vuntr type veth peer name vuntr-br
          sudo ip link set vuntr netns untrusted-peer
          sudo ip link set vuntr-br master br-lan-test up
          sudo ip netns exec untrusted-peer ip addr add 10.99.99.11/24 dev vuntr
          sudo ip netns exec untrusted-peer ip link set vuntr up
          sudo ip netns exec untrusted-peer ip link set lo up
          sudo ip netns exec untrusted-peer ip route add default via 10.99.99.1

          # fix-home-net.sh trusts anything arriving on an interface literally
          # named wg0, regardless of source -- this stands in for the tunnel.
          sudo ip netns add vpn-peer
          sudo ip link add wg0 type veth peer name veth-vpn-peer
          sudo ip link set veth-vpn-peer netns vpn-peer
          sudo ip addr add 10.13.13.1/24 dev wg0
          sudo ip link set wg0 up
          sudo ip netns exec vpn-peer ip addr add 10.13.13.2/24 dev veth-vpn-peer
          sudo ip netns exec vpn-peer ip link set veth-vpn-peer up
          sudo ip netns exec vpn-peer ip link set lo up
          sudo ip netns exec vpn-peer ip route add default via 10.13.13.1

          # Passed on to the next step, since each step here runs in its own shell
          echo "TRUSTED_MAC=$(sudo ip netns exec trusted-peer cat /sys/class/net/vtrust/address)" >> "$GITHUB_ENV"

      - name: Configure TRUSTED_LAN_DEVICES for the simulated trusted peer
        working-directory: services
        run: |
          # Only the trusted peer's IP@MAC goes in, so the untrusted one stays untrusted
          cp ../.env.example .env
          sed -i '/^TRUSTED_LAN_DEVICES=/d' .env
          echo "TRUSTED_LAN_DEVICES=10.99.99.10@${TRUSTED_MAC}" >> .env

      - name: Run fix-home-net.sh
        run: |
          output=$(sudo ./scripts/fix-home-net.sh 2>&1) || failed=true
          echo "$output"
          if [ "${failed:-false}" = "true" ]; then
            echo "fix-home-net.sh failed"
            exit 1
          fi
          if echo "$output" | grep -q WARNING; then
            echo "fix-home-net.sh warned about the trusted peer, which should have matched. False positive?"
            exit 1
          fi

      - name: Run home network config check
        run: |
          output=$(sudo ./scripts/check-network-config-home.sh 2>&1)
          echo "$output"
          if echo "$output" | grep -q ERROR; then
            echo "check-network-config-home.sh reported at least one ERROR"
            exit 1
          fi

      - name: Verify trusted LAN peer can reach jellyfin
        run: |
          for i in $(seq 1 12); do
            response=$(sudo ip netns exec trusted-peer curl -s --max-time 5 -w "\nHTTP_STATUS:%{http_code}" http://10.99.99.1:8096/health) || true
            status=$(echo "$response" | grep -oP 'HTTP_STATUS:\K[0-9]+' || echo "000")
            if [ "$status" = "200" ]; then
              echo "$response"
              echo "trusted peer reached jellyfin"
              exit 0
            fi
            echo "not healthy yet (attempt $i/12): $response, retrying in 5s..."
            sleep 5
          done
          echo "trusted peer never got a healthy response after 60s"
          exit 1

      - name: Verify untrusted LAN peer cannot reach jellyfin
        run: |
          if sudo ip netns exec untrusted-peer curl -sf --max-time 5 http://10.99.99.1:8096/health; then
            echo "untrusted peer reached jellyfin -- firewall is not blocking it"
            exit 1
          fi
          echo "untrusted peer correctly blocked"

      - name: Verify simulated WireGuard peer can reach jellyfin
        run: sudo ip netns exec vpn-peer curl -sf --max-time 5 http://10.13.13.1:8096/health

      - name: Read the real SSH port
        run: |
          port=$(sudo sshd -T 2>/dev/null | awk '/^port / && !p {print $2; p=1}')
          echo "SSH_PORT=${port:-22}" >> "$GITHUB_ENV"

      - name: Verify trusted LAN peer can reach SSH
        run: sudo ip netns exec trusted-peer timeout 3 bash -c "echo > /dev/tcp/10.99.99.1/$SSH_PORT"

      - name: Verify untrusted LAN peer cannot reach SSH
        run: |
          set -euo pipefail
          if sudo ip netns exec untrusted-peer timeout 3 bash -c "echo > /dev/tcp/10.99.99.1/$SSH_PORT"; then
            echo "untrusted peer reached SSH -- firewall is not blocking it"
            exit 1
          fi
          echo "untrusted peer correctly blocked from SSH"

      - name: Verify simulated WireGuard peer can reach SSH
        run: sudo ip netns exec vpn-peer timeout 3 bash -c "echo > /dev/tcp/10.13.13.1/$SSH_PORT"

      # The wg0 DOCKER_GUARD rule must only accept DNAT'd (published-service) traffic
      - name: Verify simulated WireGuard peer cannot reach non-published LAN traffic
        run: |
          if sudo ip netns exec vpn-peer ping -c 2 -W 2 10.99.99.10; then
            echo "vpn-peer reached the trusted LAN peer directly -- FORWARD is not blocking non-published traffic"
            exit 1
          fi
          echo "vpn-peer correctly blocked from reaching LAN traffic that isn't a published service"

      - name: Verify container egress still works
        run: sudo docker exec jellyfin curl -sf --max-time 5 -o /dev/null http://example.com/

      - name: Clean up simulated network namespaces
        if: always()
        run: |
          sudo ip netns del trusted-peer 2>/dev/null || true
          sudo ip netns del untrusted-peer 2>/dev/null || true
          sudo ip netns del vpn-peer 2>/dev/null || true
          sudo ip link del br-lan-test 2>/dev/null || true
          sudo ip link del wg0 2>/dev/null || true
