services:
  nginx:
    container_name: nginx
    image: nginx:1.31.5-alpine
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    environment:
      - NGINX_ENVSUBST_OUTPUT_DIR=/etc/nginx  # default is conf.d only, but services/nginx/templates/ also has nginx.conf/proxy_params.conf
      - NGINX_ENVSUBST_FILTER=^(LAN_SUBNET|VPN_SUBNET|NGINX_HTTPS_PORT)$$  # protects nginx's own $host/$remote_addr/etc
      - LAN_SUBNET=${LAN_SUBNET:?Set LAN_SUBNET in .env}
      - VPN_SUBNET=${VPN_SUBNET:?Set VPN_SUBNET in .env}
      - NGINX_HTTPS_PORT=${NGINX_HTTPS_PORT:-443}  # so the HTTP->HTTPS redirect points at the real published port
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - adguard
      - jellyfin
      - syncthing
    healthcheck:
      test: curl -fsS -m 2 127.0.0.1/healthz || exit 1
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 1m

  adguard:
    container_name: adguard
    image: adguard/adguardhome:v0.107.79
    restart: unless-stopped
    # Match your host UID/GID (check with `id`) so ./adguard/conf stays writable by you
    user: "1000:1000"
    ports:
      - "${ADGUARD_DNS_PORT:-53}:53/tcp"
      - "${ADGUARD_DNS_PORT:-53}:53/udp"
      - "${ADGUARD_WEB_PORT:-8080}:80/tcp"
      # First-run setup wizard only (see SERVICES.md). Closes itself once configured
      - "${ADGUARD_SETUP_PORT:-3000}:3000/tcp"
    environment:
      TZ: ${TZ:-Etc/UTC}  # <your_time_zone>
    volumes:
      # Bind mounts, not named volumes: a named volume would be root-owned, unwritable by user: above.
      - ./adguard/conf:/opt/adguardhome/conf
      - ./adguard/work:/opt/adguardhome/work
    cap_add:
      - NET_ADMIN
    healthcheck:
      test: ["CMD", "nslookup", "healthcheck.adguardhome.test", "127.0.0.1"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 1m

  syncthing:
    container_name: syncthing
    image: lscr.io/linuxserver/syncthing:2.1.3
    restart: unless-stopped
    hostname: minipc-syncthing
    ports:
      - "${SYNCTHING_WEB_PORT:-8384}:8384"         # Web GUI
      - "${SYNCTHING_SYNC_PORT:-22000}:22000/tcp"
      - "${SYNCTHING_SYNC_PORT:-22000}:22000/udp"
      - "${SYNCTHING_DISCOVERY_PORT:-21027}:21027/udp"
    environment:
      - PUID=1000  # You can check your PUID with the command `id`
      - PGID=1000  # You can check your PGID with the command `id`
      - TZ=${TZ:-Etc/UTC}  # <your_time_zone>
    volumes:
      - syncthing_config:/config
      - ${SYNCTHING_MOUNT_1:-/path/to/data1:/data1}
      - ${SYNCTHING_MOUNT_2:-/path/to/data2:/data2}
      # Add more data paths as needed (SYNCTHING_MOUNT_3, etc.)
    healthcheck:
      test: curl -fkLsS -m 2 127.0.0.1:8384/rest/noauth/health | grep -o --color=never OK || exit 1
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 1m

  homepage:
    container_name: homepage
    image: ghcr.io/gethomepage/homepage:v1.13.2
    restart: unless-stopped
    ports:
      - "${HOMEPAGE_WEB_PORT:-3001}:3000"
    environment:
      - PUID=1000  # You can check your PUID with the command `id`
      - PGID=1000  # You can check your PGID with the command `id`
      - TZ=${TZ:-Etc/UTC}  # <your_time_zone>
      - HOMEPAGE_ALLOWED_HOSTS=${HOMEPAGE_ALLOWED_HOSTS:?Set HOMEPAGE_ALLOWED_HOSTS in .env}  # host[:port] you access this from: LAN IP, and WireGuard tunnel IP if used over the VPN
    volumes:
      - ./homepage:/app/config
      # Read-only, so the disk widget reports the host's real usage, not the container's
      - /:/host:ro
    # healthcheck: already baked into this image, no need to add one

  jellyfin:
    container_name: jellyfin
    image: lscr.io/linuxserver/jellyfin:10.11.11
    restart: unless-stopped
    ports:
      - "${JELLYFIN_WEB_PORT:-8096}:8096/tcp"  # Web GUI
      - "${JELLYFIN_DISCOVERY_PORT:-7359}:7359/udp"  # Auto discovery
    environment:
      - PUID=1000  # You can check your PUID with the command `id`
      - PGID=1000  # You can check your PGID with the command `id`
      - TZ=${TZ:-Etc/UTC}  # <your_time_zone>
      # - JELLYFIN_PublishedServerUrl=http://jellyfin.home:8096  # Server address shown to Jellyfin apps
    volumes:
      - jellyfin_config:/config
      - jellyfin_cache:/cache
      - ${JELLYFIN_MEDIA_1:-/path/to/media:/media}
      # - ${JELLYFIN_MEDIA_2:-/path/to/media2:/media2}  # Add more media paths as needed
    # healthcheck: no HEALTHCHECK, its /health endpoint can't be used during startup migrations
    # See: https://jellyfin.org/docs/general/post-install/networking/advanced/monitoring/

volumes:
  syncthing_config:
    name: syncthing_config
  jellyfin_config:
    name: jellyfin_config
  jellyfin_cache:
    name: jellyfin_cache
