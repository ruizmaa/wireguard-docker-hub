services:
  nginx:
    container_name: nginx
    image: nginx:1.31.5-alpine
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    environment:
      - NGINX_ENVSUBST_OUTPUT_DIR=/etc/nginx  # default is conf.d only, but services/nginx/templates/ also has nginx.conf/proxy_params.conf
      - NGINX_ENVSUBST_FILTER=^(LAN_SUBNET|VPN_SUBNET|NGINX_HTTPS_PORT|TRUENAS_IP)$$  # protects nginx's own $host/$remote_addr/etc
      - LAN_SUBNET=${LAN_SUBNET:?Set LAN_SUBNET in .env}
      - VPN_SUBNET=${VPN_SUBNET:?Set VPN_SUBNET in .env}
      - NGINX_HTTPS_PORT=${NGINX_HTTPS_PORT:-443}  # so the HTTP->HTTPS redirect points at the real published port
      - TRUENAS_IP=${TRUENAS_IP:?Set TRUENAS_IP in .env}  # substituted into truenas.conf.template's backend
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - adguard
      - dockge
      - glances
      - homepage
      - jellyfin
      - qbittorrent
      - radarr
      - sonarr
      - prowlarr
      - syncthing
    healthcheck:
      test: curl -fsS -m 2 127.0.0.1/healthz || exit 1
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 1m

  adguard:
    container_name: adguard
    image: adguard/adguardhome:v0.107.79
    restart: unless-stopped
    # Match your host UID/GID (check with `id`) so ./adguard/conf stays writable by you
    user: "1000:1000"
    ports:
      - "${ADGUARD_DNS_PORT:-53}:53/tcp"
      - "${ADGUARD_DNS_PORT:-53}:53/udp"
      - "${ADGUARD_WEB_PORT:-8080}:80/tcp"
      # First-run setup wizard only (see SERVICES.md). Closes itself once configured
      - "${ADGUARD_SETUP_PORT:-3000}:3000/tcp"
    environment:
      TZ: ${TZ:-Etc/UTC}  # <your_time_zone>
    volumes:
      # Bind mounts, not named volumes: a named volume would be root-owned, unwritable by user: above.
      - ./adguard/conf:/opt/adguardhome/conf
      - ./adguard/work:/opt/adguardhome/work
    cap_add:
      - NET_ADMIN
    healthcheck:
      test: ["CMD", "nslookup", "healthcheck.adguardhome.test", "127.0.0.1"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 1m

  syncthing:
    container_name: syncthing
    image: lscr.io/linuxserver/syncthing:2.1.5
    restart: unless-stopped
    hostname: minipc-syncthing
    ports:
      - "${SYNCTHING_WEB_PORT:-8384}:8384"         # Web GUI
      - "${SYNCTHING_SYNC_PORT:-22000}:22000/tcp"
      - "${SYNCTHING_SYNC_PORT:-22000}:22000/udp"
      - "${SYNCTHING_DISCOVERY_PORT:-21027}:21027/udp"
    environment:
      - PUID=1000  # You can check your PUID with the command `id`
      - PGID=1000  # You can check your PGID with the command `id`
      - TZ=${TZ:-Etc/UTC}  # <your_time_zone>
    volumes:
      - syncthing_config:/config
      - ${SYNCTHING_MOUNT_1:-/path/to/data1:/data1}
      - ${SYNCTHING_MOUNT_2:-/path/to/data2:/data2}
      # Add more data paths as needed (SYNCTHING_MOUNT_3, etc.)
    healthcheck:
      test: curl -fkLsS -m 2 127.0.0.1:8384/rest/noauth/health | grep -o --color=never OK || exit 1
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 1m

  homepage:
    container_name: homepage
    image: ghcr.io/gethomepage/homepage:v2.3.0
    restart: unless-stopped
    ports:
      - "${HOMEPAGE_WEB_PORT:-3001}:3000"
    environment:
      - PUID=1000  # You can check your PUID with the command `id`
      - PGID=1000  # You can check your PGID with the command `id`
      - TZ=${TZ:-Etc/UTC}  # <your_time_zone>
      - HOMEPAGE_ALLOWED_HOSTS=${HOMEPAGE_ALLOWED_HOSTS:?Set HOMEPAGE_ALLOWED_HOSTS in .env}  # host[:port] you access this from: LAN IP, and WireGuard tunnel IP if used over the VPN, plus homepage.home.arpa (nginx)
      - HOMEPAGE_VAR_HTTPS_PORT=${NGINX_HTTPS_PORT:-443}  # substituted into services.yaml hrefs, see services/homepage/services.yaml
      - HOMEPAGE_VAR_GLANCES_USERNAME=${GLANCES_USERNAME:-glances}  # substituted into widgets.yaml, see services/homepage/widgets.yaml
      - HOMEPAGE_VAR_GLANCES_PASSWORD=${GLANCES_PASSWORD:-}  # substituted into widgets.yaml, set in .env and run ./services/generate-glances-config.sh
    volumes:
      - ./homepage:/app/config
      - homepage_disk_probe:/host:ro
    # healthcheck: already baked into this image, no need to add one

  jellyfin:
    container_name: jellyfin
    image: lscr.io/linuxserver/jellyfin:10.11.11
    restart: unless-stopped
    ports:
      - "${JELLYFIN_WEB_PORT:-8096}:8096/tcp"  # Web GUI
      - "${JELLYFIN_DISCOVERY_PORT:-7359}:7359/udp"  # Auto discovery
    environment:
      - PUID=1000  # You can check your PUID with the command `id`
      - PGID=1000  # You can check your PGID with the command `id`
      - TZ=${TZ:-Etc/UTC}  # <your_time_zone>
      # - JELLYFIN_PublishedServerUrl=http://jellyfin.home:8096  # Server address shown to Jellyfin apps
    volumes:
      - jellyfin_config:/config
      - jellyfin_cache:/cache
      - ${LOCAL_MOUNT_MEDIA_PATH:-/mnt/nas_media}/movies:/data/movies:ro
      - ${LOCAL_MOUNT_MEDIA_PATH:-/mnt/nas_media}/tvshows:/data/tvshows:ro
      # - ${JELLYFIN_MEDIA_3:-/path/to/media3:/media3}  # Add more media paths as needed
    devices:
      - /dev/dri:/dev/dri  # Intel QuickSync hardware acceleration
    # healthcheck: no HEALTHCHECK, its /health endpoint can't be used during startup migrations
    # See: https://jellyfin.org/docs/general/post-install/networking/advanced/monitoring/
  
  qbittorrent:
    container_name: qbittorrent
    image: lscr.io/linuxserver/qbittorrent:5.2.3
    restart: unless-stopped
    ports:
      - "${QBITTORRENT_WEB_PORT:-8081}:8080"
      - "6881:6881"
      - "6881:6881/udp"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ:-Etc/UTC}
      - WEBUI_PORT=8080
    volumes:
      - qbittorrent_config:/config
      # Bind mount to a NAS path for downloads, defaulting to /mnt/nas_media/downloads if LOCAL_MOUNT_MEDIA_PATH is not set in .env
      - ${LOCAL_MOUNT_MEDIA_PATH:-/mnt/nas_media}/downloads:/downloads
    healthcheck:
      test: curl -fsS -m 2 http://127.0.0.1:8080 || exit 1
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s
  
  prowlarr:
    container_name: prowlarr
    image: lscr.io/linuxserver/prowlarr:latest
    restart: unless-stopped
    ports:
      - "${PROWLARR_WEB_PORT:-9696}:9696"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ:-Etc/UTC}
    volumes:
      - prowlarr_config:/config
    healthcheck:
      test: curl -fsS -m 2 http://127.0.0.1:9696/ping || exit 1
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s

  radarr:
    container_name: radarr
    image: lscr.io/linuxserver/radarr:6.4.4
    restart: unless-stopped
    ports:
      - "${RADARR_WEB_PORT:-7878}:7878"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ:-Etc/UTC}
    volumes:
      - radarr_config:/config
      # Bind mount to a NAS path for media, defaulting to /mnt/nas_media if LOCAL_MOUNT_MEDIA_PATH is not set in .env
      - ${LOCAL_MOUNT_MEDIA_PATH:-/mnt/nas_media}:/media
    depends_on:
      - qbittorrent
      - prowlarr
    healthcheck:
      test: curl -fsS -m 2 http://127.0.0.1:7878/ping || exit 1
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s

  sonarr:
    container_name: sonarr
    image: lscr.io/linuxserver/sonarr:4.0.20
    restart: unless-stopped
    ports:
      - "${SONARR_WEB_PORT:-8989}:8989"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ:-Etc/UTC}
    volumes:
      - sonarr_config:/config
      # Bind mount to a NAS path for media, defaulting to /mnt/nas_media if LOCAL_MOUNT_MEDIA_PATH is not set in .env
      - ${LOCAL_MOUNT_MEDIA_PATH:-/mnt/nas_media}:/media
    depends_on:
      - qbittorrent
      - prowlarr
    healthcheck:
      test: curl -fsS -m 2 http://127.0.0.1:8989/ping || exit 1
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s

  dockge:
    container_name: dockge
    image: louislam/dockge:1.5.0
    restart: unless-stopped
    ports:
      - "${DOCKGE_WEB_PORT:-5001}:5001"
    environment:
      # No PUID/PGID, this image ignores them and always runs as root
      - DOCKGE_STACKS_DIR=${DOCKGE_STACKS_DIR:-/opt/stacks}
    volumes:
      # Grants root-equivalent control over the host's Docker daemon
      - /var/run/docker.sock:/var/run/docker.sock
      - dockge_data:/app/data
      # Host path must equal container path as Dockge runs `docker compose` against this path itself
      - ${DOCKGE_STACKS_DIR:-/opt/stacks}:${DOCKGE_STACKS_DIR:-/opt/stacks}
    # healthcheck: already baked into this image, no need to add one

  glances:
    container_name: glances
    image: nicolargo/glances:4.5.6
    restart: unless-stopped
    ports:
      - "${GLANCES_WEB_PORT:-61208}:61208"
    environment:
      - GLANCES_OPT=-w --password -u ${GLANCES_USERNAME:-glances}
      - TZ=${TZ:-Etc/UTC}  # <your_time_zone>
    volumes:
      # No pid: host, no docker.sock: CPU/RAM/disk/network already work without them (see SERVICES.md)
      - ./glances:/root/.config/glances:ro
    healthcheck:
      test: curl -fsS -m 2 -o /dev/null 127.0.0.1:61208/api/4/status || exit 1
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 1m

volumes:
  homepage_disk_probe:
    name: homepage_disk_probe
  syncthing_config:
    name: syncthing_config
  jellyfin_config:
    name: jellyfin_config
  jellyfin_cache:
    name: jellyfin_cache
  dockge_data:
    name: dockge_data
  qbittorrent_config:
    name: qbittorrent_config
  prowlarr_config:
    name: prowlarr_config
  radarr_config:
    name: radarr_config
  sonarr_config:
    name: sonarr_config
