- Home Server:
    - AdGuard:
        icon: adguard-home.png
        href: "https://adguard.home.arpa:{{HOMEPAGE_VAR_HTTPS_PORT}}"
        description: DNS sinkhole
    - Dockge:
        icon: dockge.png
        href: "https://dockge.home.arpa:{{HOMEPAGE_VAR_HTTPS_PORT}}"
        description: Container/stack manager
    - Glances:
        icon: glances.png
        href: "https://glances.home.arpa:{{HOMEPAGE_VAR_HTTPS_PORT}}"
        description: System monitor
    - Syncthing:
        icon: syncthing.png
        href: "https://syncthing.home.arpa:{{HOMEPAGE_VAR_HTTPS_PORT}}"
        description: File synchronization
    - TrueNAS:
        icon: truenas-scale.png
        href: "https://truenas.home.arpa:{{HOMEPAGE_VAR_HTTPS_PORT}}/ui"
        description: TrueNAS ui

- Proxmox:
    # Standalone nodes, one card each. The widgets talk to each node's API directly (IP, port 8006/8007), not through nginx
    - pve1:
        icon: proxmox.png
        href: "https://pve1.home.arpa:{{HOMEPAGE_VAR_HTTPS_PORT}}"
        description: Proxmox VE node
        widget:
          type: proxmox
          url: "https://{{HOMEPAGE_VAR_PVE1_IP}}:8006"
          username: "{{HOMEPAGE_VAR_PVE1_TOKEN_ID}}"
          password: "{{HOMEPAGE_VAR_PVE1_TOKEN_SECRET}}"
    - pve2:
        icon: proxmox.png
        href: "https://pve2.home.arpa:{{HOMEPAGE_VAR_HTTPS_PORT}}"
        description: Proxmox VE node
        widget:
          type: proxmox
          url: "https://{{HOMEPAGE_VAR_PVE2_IP}}:8006"
          username: "{{HOMEPAGE_VAR_PVE2_TOKEN_ID}}"
          password: "{{HOMEPAGE_VAR_PVE2_TOKEN_SECRET}}"
    - pbs:
        icon: proxmox-backup-server.png
        href: "https://pbs.home.arpa:{{HOMEPAGE_VAR_HTTPS_PORT}}"
        description: Proxmox Backup Server
        widget:
          type: proxmoxbackupserver
          url: "https://{{HOMEPAGE_VAR_PBS_IP}}:8007"
          username: "{{HOMEPAGE_VAR_PBS_TOKEN_ID}}"
          password: "{{HOMEPAGE_VAR_PBS_TOKEN_SECRET}}"

- Media Arr Stack:
    # Ordered as the real pipeline: indexers -> collection managers -> downloader -> playback
    - Prowlarr:
        icon: prowlarr.png
        href: "https://prowlarr.home.arpa:{{HOMEPAGE_VAR_HTTPS_PORT}}"
        description: Indexer manager

    # Nested group: renders as one column inside the parent row
    - Collection Managers:
        - Radarr:
            icon: radarr.png
            href: "https://radarr.home.arpa:{{HOMEPAGE_VAR_HTTPS_PORT}}"
            description: Movie collection manager
        - Sonarr:
            icon: sonarr.png
            href: "https://sonarr.home.arpa:{{HOMEPAGE_VAR_HTTPS_PORT}}"
            description: TV show collection manager
        - Lidarr:
            icon: lidarr.png
            href: "https://lidarr.home.arpa:{{HOMEPAGE_VAR_HTTPS_PORT}}"
            description: Music collection manager

    - qBittorrent:
        icon: qbittorrent.png
        href: "https://qbittorrent.home.arpa:{{HOMEPAGE_VAR_HTTPS_PORT}}"
        description: BitTorrent client

    - Jellyfin:
        icon: jellyfin.png
        href: "https://jellyfin.home.arpa:{{HOMEPAGE_VAR_HTTPS_PORT}}"
        description: Media server

- System Monitor:
    - Top Processes:
        widget:
          type: glances
          url: http://glances:61208
          username: "{{HOMEPAGE_VAR_GLANCES_USERNAME}}"
          password: "{{HOMEPAGE_VAR_GLANCES_PASSWORD}}"
          version: 4
          metric: process
    - CPU:
        widget:
          type: glances
          url: http://glances:61208
          username: "{{HOMEPAGE_VAR_GLANCES_USERNAME}}"
          password: "{{HOMEPAGE_VAR_GLANCES_PASSWORD}}"
          version: 4
          metric: cpu
          chart: true
    - Memory:
        widget:
          type: glances
          url: http://glances:61208
          username: "{{HOMEPAGE_VAR_GLANCES_USERNAME}}"
          password: "{{HOMEPAGE_VAR_GLANCES_PASSWORD}}"
          version: 4
          metric: memory
          chart: true
    - Network:
        widget:
          type: glances
          url: http://glances:61208
          username: "{{HOMEPAGE_VAR_GLANCES_USERNAME}}"
          password: "{{HOMEPAGE_VAR_GLANCES_PASSWORD}}"
          version: 4
          metric: network:eth0
          chart: true
    - Disk I/O:
        widget:
          type: glances
          url: http://glances:61208
          username: "{{HOMEPAGE_VAR_GLANCES_USERNAME}}"
          password: "{{HOMEPAGE_VAR_GLANCES_PASSWORD}}"
          version: 4
          metric: disk:sda
    - Disk:
        widget:
          type: glances
          url: http://glances:61208
          username: "{{HOMEPAGE_VAR_GLANCES_USERNAME}}"
          password: "{{HOMEPAGE_VAR_GLANCES_PASSWORD}}"
          version: 4
          metric: fs:/
