title: Home Server
theme: dark
color: slate
headerStyle: clean
layout:
  Home Server:
    style: row
    columns: 5
  System Monitor:
    style: row
    columns: 5
  Media Arr Stack:
    style: row
    # Applies to the subgroup grid: Indexer | Collection Managers | Downloader | Playback
    columns: 4
    useEqualHeights: true
    Indexer:
      header: false
    Collection Managers:
      style: column
    Downloader:
      header: false
    Playback:
      header: false
